<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Geoportal DRK</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="./style.css">
<style>
  .risk-title {font-weight:700;color:#15384d;font-size:14px;margin:13px 0 6px}
  .risk-box {font-size:13px;line-height:1.45;padding:10px;border:1px solid #d3dee5;border-radius:8px;background:#f7fafc;color:#233b49}
  .risk-box[data-level="yes"] {border-color:#de9a92;background:#fff1ef}
  .risk-box[data-level="no"] {border-color:#9abca6;background:#effaf2}
  .risk-box[data-level="unknown"] {border-color:#d3dee5;background:#f7fafc}
</style>
</head>
<body>
<div id="map" aria-label="Mapa Polski"></div>
<div class="panel">
 <h1>Geoportal DRK</h1>
 <form id="searchForm"><label for="address">Wyszukaj adres w Polsce</label><div class="search"><input id="address" type="search" placeholder="np. Marszałkowska 1, Warszawa" required minlength="3"><button type="submit" id="searchBtn">Szukaj</button></div></form>
 <div id="message" role="status" aria-live="polite"></div>
 <button type="button" id="resetBtn" class="secondary">↩ Cała Polska</button>
 <label class="check"><input type="checkbox" id="borderToggle" checked> Granica Polski</label>
 <label class="check"><input type="checkbox" id="layerToggle"> Odległość 30 km od granic miast powyżej 300tys mieszk.</label>
 <label class="check"><input type="checkbox" id="citiesToggle" checked> Miasta wojewódzkie</label>
 <label class="check"><input type="checkbox" id="floodingToggle"> Podtopienia PIG — Mazowsze</label>
  <label class="check">
  <input type="checkbox" id="powodz10Toggle">
  Powódź 10-letnia (Q10%) — Wody Polskie
</label>
 <div class="risk-title">Ocena wskazanej lokalizacji</div>
 <div id="floodingResult" class="risk-box" data-level="unknown" role="status" aria-live="polite">Kliknij punkt na mapie lub wyszukaj adres.</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
<script src="podtopienia.js"></script>
</body>
</html>
